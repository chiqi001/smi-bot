name: SMI MTF Bot (M5+M30+H1)

# Sygnał LONG/SHORT, gdy SMI jest w strefie jednocześnie na M5, M30 i H1.
# Kod w folderze mtf/. Używa tych samych sekretów co stary bot:
# TELEGRAM_TOKEN i TELEGRAM_CHAT_ID. Keepalive robi istniejący keepalive.yml.

on:
  schedule:
    - cron: "1-59/5 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Wyślij wiadomość testową z aktualnymi wartościami SMI"
        type: boolean
        default: false

permissions:
  contents: write   # zapis mtf/state.json

concurrency:
  group: smi-mtf
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: mtf
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mtf/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SYMBOLS: ${{ vars.MTF_SYMBOLS }}
          LONG_LEVEL: ${{ vars.MTF_LONG_LEVEL }}
          SHORT_LEVEL: ${{ vars.MTF_SHORT_LEVEL }}
          REARM_MARGIN: ${{ vars.MTF_REARM_MARGIN }}
          SEND_TEST: ${{ inputs.test }}
        run: python smi_bot.py

      - name: Save state
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "MTF bot state [skip ci]"
            for i in 1 2 3; do
              git pull --rebase --quiet && git push && break
              sleep 3
            done
          fi
