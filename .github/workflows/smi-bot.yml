name: SMI Bot

on:
  schedule:
    - cron: "*/15 * * * *"   # co 15 minut (GitHub potrafi opóźnić start o kilka-kilkanaście minut)
  workflow_dispatch:          # przycisk "Run workflow" do ręcznego testu
    inputs:
      test:
        description: "Wyślij testową wiadomość na Telegram"
        type: boolean
        default: true
      replay:
        description: "Wyślij ostatni sygnał z dnia (RRRR-MM-DD), puste = nie"
        type: string
        default: ""
      replay_all:
        description: "Z historii wyślij wszystkie sygnały z tego dnia"
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Przywróć stan (żeby nie dublować powiadomień)
        uses: actions/cache/restore@v4
        with:
          path: smi_state.json
          key: smi-state-${{ github.run_id }}
          restore-keys: smi-state-

      - name: Testowa wiadomość
        if: github.event_name == 'workflow_dispatch' && inputs.test
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python smi_bot.py --test

      - name: Sygnały z historii
        if: github.event_name == 'workflow_dispatch' && inputs.replay != ''
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPLAY_DAY: ${{ inputs.replay }}
        run: python smi_bot.py --replay "$REPLAY_DAY" ${{ inputs.replay_all && '--all' || '' }}

      - name: Aktualne SMI (do porównania z TradingView)
        run: python smi_bot.py --status

      - name: Sprawdź sygnały SMI
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python smi_bot.py

      - name: Zapisz stan
        if: always()
        uses: actions/cache/save@v4
        with:
          path: smi_state.json
          key: smi-state-${{ github.run_id }}
